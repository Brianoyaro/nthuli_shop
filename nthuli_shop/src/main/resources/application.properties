spring.application.name=nthuli_shop

# Load .env file for environment variables (Spring Boot 2.4+)
# Optional prefix prevents app failure if .env file is missing
spring.config.import=optional:file:.env[.properties]


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nthuli_shop
spring.datasource.username=brian
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret.key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access.token.expiration=900000
jwt.refresh.token.expiration=604800000
jwt.issuer=authentication-service
jwt.audience=authentication-client

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


# M-Pesa Configuration - SANDBOX
mpesa.consumer-key=${MPESA_CONSUMER_KEY:YOUR_CONSUMER_KEY}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:YOUR_CONSUMER_SECRET}
mpesa.stk-push-url=${MPESA_STK_PUSH_URL:https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}
mpesa.access-token-url=${MPESA_ACCESS_TOKEN_URL:https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
mpesa.callback-url=${MPESA_CALLBACK_URL:http://localhost:8080/api/payments/mpesa/callback}
mpesa.party-a=${MPESA_PARTY_A:YOUR_PARTY_A}
mpesa.party-b=${MPESA_PARTY_B:YOUR_PARTY_B}
mpesa.pass-key=${MPESA_PASS_KEY:YOUR_PASS_KEY}

# Email Configuration
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000

# App-specific email settings
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:password}
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${EMAIL_FROM:noreply@nthuli-shop.com}

# Frontend Configuration
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}


